/* ============ 状态与逻辑 ============ */
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let scores = {};
let currentResult = null;

const $ = s => document.querySelector(s);
function show(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function startQuiz(){
  answers.fill(null);
  current = 0;
  scores = { D: 0, B: 0, Z: 0, A: 0, S: 0, L: 0, F: 0, M: 0, C: 0, J: 0 };
  renderQuestion();
  show('screen-quiz');
}

function renderQuestion(){
  const q = QUESTIONS[current];
  $('#qNum').textContent = 'Q' + (current + 1);
  $('#qTitle').textContent = q.q;
  $('#counter').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  $('#progressIn').style.width = ((current + 1) / QUESTIONS.length * 100) + '%';
  $('#backBtn').disabled = current === 0;

  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[current] === idx ? ' sel' : '');
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.onclick = () => pick(idx);
    box.appendChild(btn);
  });

  const card = box.parentElement;
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'fadeUp .35s ease both';
}

function pick(choice){
  const opts = document.querySelectorAll('.opt');
  if (opts[choice].classList.contains('sel')) return; // 防止重复点击

  answers[current] = choice;
  opts.forEach(o => o.classList.remove('sel'));
  opts[choice].classList.add('sel');

  setTimeout(() => {
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      renderResult();
    }
  }, 250);
}

function goBack(){
  if (current === 0) return;
  current--;
  renderQuestion();
}

function calcResult(){
  scores = { D: 0, B: 0, Z: 0, A: 0, S: 0, L: 0, F: 0, M: 0, C: 0, J: 0 };
  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx !== null) {
      const type = QUESTIONS[qIdx].options[ansIdx].type;
      scores[type] = (scores[type] || 0) + 1;
    }
  });

  let best = 'D';
  let max = -1;
  for (const key in scores) {
    if (scores[key] > max) {
      max = scores[key];
      best = key;
    }
  }
  return best;
}

function renderResult(){
  const bestKey = calcResult();
  currentResult = bestKey;
  const t = TYPES[bestKey];

  $('#rEmoji').textContent = t.emoji;
  $('#rTag').textContent = t.tag;
  $('#rName').textContent = t.name;
  $('#rDesc').textContent = t.desc;
  $('#rQuote').innerHTML = t.quote;
  $('#rMatch').innerHTML = t.match;

  // 绘制基因图谱（按得分排序）
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const maxScore = sorted[0][1] || 1;
  const barsEl = $('#rBars');
  barsEl.innerHTML = '';
  sorted.forEach(([k, v]) => {
    const pct = 15 + (v / maxScore) * 85; // 最低保留15%
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<span class="bar-name">' + TYPES[k].name + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:0"></div></div>';
    barsEl.appendChild(row);
    requestAnimationFrame(() => {
      row.querySelector('.bar-fill').style.width = pct.toFixed(1) + '%';
    });
  });

  show('screen-result');
}

function copyShare(){
  if (!currentResult) return;
  const t = TYPES[currentResult];
  const text = '在双门洞基因测试中，我测出了自己最像《请回答1988》里的「' + t.name + '」' + t.emoji + '——' + t.tag + '。\n你是双门洞的谁？来测测看吧！';
  
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast('已复制，去粘贴吧')).catch(fallback);
  } else {
    fallback();
  }
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制，去粘贴吧'); }
    catch (e) { toast('复制失败，请长按选择'); }
    document.body.removeChild(ta);
  }
}

$('#startBtn').addEventListener('click', startQuiz);
$('#backBtn').addEventListener('click', goBack);
$('#againBtn').addEventListener('click', startQuiz);
$('#copyBtn').addEventListener('click', copyShare);
</script>
